# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # macOS is pinned to R 4.5 because CRAN serves the macOS binaries
          # for the R version `release` resolves to (4.6 on 2026-09-20) as
          # zstd archives and pak 0.11.1 cannot extract them, so
          # setup-r-dependencies fails on the first binary it fetches
          # (flextable) with "unknown archive type". While pinned, no job
          # checks macOS on release, and oldrel-1 already covers R 4.5.
          # Return to 'release' once pak extracts zstd or CRAN's binaries
          # for release are gzip again; a ROADMAP candidate row tracks it.
          - {os: macos-latest,   r: '4.5'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      # The macOS gdtools binary (0.5.1, 2026-09-21) links against XQuartz's
      # /opt/X11/lib/libXrender, which the runner does not ship; without it
      # gdtools fails to load, so the {flextable} Word examples error and the
      # test run segfaults.
      - name: Install XQuartz
        if: runner.os == 'macOS'
        run: brew install --cask xquartz

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  line-endings:
    runs-on: ubuntu-latest

    name: line endings

    # Same token the check job sets: without it `setup-r` resolves the release
    # unauthenticated and is subject to API rate limiting on busy runners,
    # which would fail this job for a reason unrelated to line endings.
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    # One platform is enough and is not a shortcut: the check reads each path's
    # INDEX BLOB (`git cat-file blob :path`), which no checkout-time conversion
    # touches, so every runner would read identical bytes.
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      # Base R and git only — the script loads no package, so the dependency
      # install the other job needs is not required here.
      - name: Check line-ending policy
        run: Rscript data-raw/check_line_endings.R
